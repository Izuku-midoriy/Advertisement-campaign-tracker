name: Advertisement Campaign Tracker CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build-test-docker:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Build and run tests
        run: ./mvnw clean verify

      - name: Verify Docker installation
        run: docker --version

      - name: Build Docker image
        run: |
          docker build \
            -t advertisement-campaign-tracker:${{ github.sha }} \
            -t advertisement-campaign-tracker:latest \
            .

      - name: Verify Docker image
        run: docker images advertisement-campaign-tracker