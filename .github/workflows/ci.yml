name: Advertisement Campaign Tracker CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-test-docker:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Build and run tests
        run: ./mvnw clean verify

      - name: Verify Docker installation
        run: docker --version

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/advertisement-campaign-tracker:${{ github.sha }} \
            -t ghcr.io/${{ github.repository_owner }}/advertisement-campaign-tracker:latest \
            .

      - name: Verify Docker image
        run: |
          docker images ghcr.io/${{ github.repository_owner }}/advertisement-campaign-tracker

      - name: Push Docker image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/advertisement-campaign-tracker:${{ github.sha }}
          docker push ghcr.io/${{ github.repository_owner }}/advertisement-campaign-tracker:latest